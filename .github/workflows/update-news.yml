name: Update verified Bitcoin news

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to backfill (1-14)"
        required: false
        default: "1"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, cross-check, and classify news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWS_LOOKBACK_DAYS: ${{ inputs.lookback_days || '1' }}
        run: python scripts/update_news.py
      - name: Commit verified updates
        id: publish
        run: |
          if git diff --quiet -- site/live-news.json; then
            echo "No verified update"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "taehwan-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/live-news.json
          git commit -m "news: publish verified update"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload current site
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy current site
        if: steps.publish.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
