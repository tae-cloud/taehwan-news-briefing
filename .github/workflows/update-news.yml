name: Update verified Bitcoin news

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, cross-check, and classify news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_news.py
      - name: Commit verified updates
        run: |
          if git diff --quiet -- site/live-news.json; then
            echo "No verified update"
            exit 0
          fi
          git config user.name "taehwan-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/live-news.json
          git commit -m "news: publish verified update"
          git push
